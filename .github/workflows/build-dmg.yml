name: Build DMG

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Core tests (VoCore)
        run: swift test --package-path Packages/VoCore

      - name: Install tools (XcodeGen, ffmpeg for test samples)
        run: brew install xcodegen ffmpeg

      - name: Media tests (VoMedia, end-to-end export of mp4/mkv/webm/avi/flv)
        timeout-minutes: 20
        run: swift test --package-path Packages/VoMedia 2>&1 | tee media-tests.log; exit ${PIPESTATUS[0]}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build app (Release, arm64)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project VoPlayer.xcodeproj \
            -scheme VoPlayer \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- | tee build/xcodebuild.log | grep -E "error:|warning: .*VoPlayer|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release/VoPlayer.app

      - name: Ad-hoc sign and verify
        run: |
          APP=build/Build/Products/Release/VoPlayer.app
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/VoPlayer"
          echo "Bundled shaders:"; ls "$APP/Contents/Resources/Shaders"
          test -f "$APP/Contents/Resources/Shaders/Upscale_RealLife_x2_M.glsl"
          du -sh "$APP"

      - name: Smoke test (launch for a few seconds)
        continue-on-error: true
        run: |
          APP=build/Build/Products/Release/VoPlayer.app
          "$APP/Contents/MacOS/VoPlayer" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if kill -0 $PID 2>/dev/null; then echo "app is running"; kill $PID; else echo "app exited early"; cat smoke.log; exit 1; fi

      - name: Package DMG
        run: |
          VERSION=$(git describe --tags --always)
          scripts/make_dmg.sh build/Build/Products/Release/VoPlayer.app "dist/VoPlayer-${VERSION}.dmg"
          ls -lh dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: VoPlayer-dmg
          path: dist/*.dmg

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build/xcodebuild.log
            media-tests.log

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
